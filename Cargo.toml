[package]
name = "epubthing"
version = "0.1.1"
edition = "2021"

[dependencies]
zip = "2"
quick-xml = { version = "0.37", features = ["serialize"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
chrono = "0.4"

[dependencies.mdka]
version = "2"
default-features = false

[dependencies.egui_commonmark]
version = "0.20"
default-features = true

[dependencies.egui_extras]
version = "0.31"
default-features = false
features = ["svg"]

[dependencies.image]
version = "0.25"
default-features = false
features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
    "tga",
    "pnm",
    "hdr",
    "dds",
    "qoi",
    "ff",
]
