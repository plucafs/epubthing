<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Open book icon -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b7e9e"/>
      <stop offset="100%" stop-color="#3a5a7c"/>
    </linearGradient>
  </defs>
  <!-- Left page -->
  <path d="M62 20 C50 18, 18 16, 12 22 L12 98 C18 92, 50 94, 62 96 Z" fill="url(#page)" stroke="#c0b8a8" stroke-width="1"/>
  <!-- Right page -->
  <path d="M66 20 C78 18, 110 16, 116 22 L116 98 C110 92, 78 94, 66 96 Z" fill="url(#page)" stroke="#c0b8a8" stroke-width="1"/>
  <!-- Spine -->
  <path d="M62 20 L66 20 L66 96 L62 96 Z" fill="#3a5a7c"/>
  <!-- Left cover -->
  <path d="M62 16 C50 14, 16 12, 10 20 L10 100 C16 94, 50 96, 62 100 Z" fill="none" stroke="url(#cover)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right cover -->
  <path d="M66 16 C78 14, 112 12, 118 20 L118 100 C112 94, 78 96, 66 100 Z" fill="none" stroke="url(#cover)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Text lines on left page -->
  <line x1="24" y1="38" x2="54" y2="36" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="48" x2="56" y2="46" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="58" x2="52" y2="56" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="68" x2="55" y2="66" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="78" x2="50" y2="76" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Text lines on right page -->
  <line x1="74" y1="36" x2="104" y2="38" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="46" x2="106" y2="48" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="56" x2="104" y2="58" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="73" y1="66" x2="105" y2="68" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="78" y1="76" x2="102" y2="78" stroke="#a09888" stroke-width="1.5" stroke-linecap="round"/>
</svg>
